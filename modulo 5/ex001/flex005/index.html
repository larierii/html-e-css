<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color:lightgreen;
            height: 100vh;
            display:flex;
            justify-content: center;
            align-items:center;
        }
        main {
            background-color: rgb(208, 134, 233);
            height: 90vh;
            width: 90vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        section {
            background-color: rgb(234, 168, 153);
            height: 200px;
            width: 200px;
        }
    </style>

</head>
<body>
    <main>
        <section>
            <h1>Pagina inicial</h1>
        </section>
    </main>
</body>
</html>
