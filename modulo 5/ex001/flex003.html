<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexbox</title>
    <style>
        .conteiner {
            background-color: blueviolet;
            display: flex;
            flex-wrap: wrap-reverse;
        }
        .item {
            background-color: aqua;
            border: 1px solid black;
            flex: auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">ITEM CONTEINER A</div>
        <div class="item">ITEM CONTEINER B</div>
        <div class="item">ITEM CONTEINER C</div>
        <div class="item">ITEM CONTEINER D</div>
        <div class="item">ITEM CONTEINER E</div>
        <div class="item">ITEM CONTEINER F</div>
        <div class="item">ITEM CONTEINER G</div>
    </div>
</body>
</html>
